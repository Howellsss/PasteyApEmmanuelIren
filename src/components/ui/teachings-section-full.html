<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Teaching</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">

<style>
  /* ================================================================
     TEACHINGS SECTION — "The Word"
     Drop the entire .teachings block into your page.
     Update TW_SLIDES in the script section with your content.
  ================================================================ */

  :root {
    --tw-bg:             #131313;
    --tw-surface:        #1a1a1a;
    --tw-gold:           #af8945;
    --tw-text-hi:        #F0F0EE;
    --tw-text-lo:        #6a6a66;
    --tw-divider:        #262626;
    --tw-btn-border:     rgba(240,240,238,0.22);
    --tw-indicator-off:  #333330;
    --tw-indicator-on:   #af8945;
    --tw-radius:         10px;
    --tw-font:           'Plus Jakarta Sans', system-ui, sans-serif;
  }

  .teachings *, .teachings *::before, .teachings *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .teachings {
    background: var(--tw-bg);
    width: 100%;
    padding-block: 72px 80px;
    padding-inline: clamp(20px, 5vw, 80px);
    font-family: var(--tw-font);
    color: var(--tw-text-hi);
  }

  .teachings-inner {
    max-width: 1160px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 44px;
  }

  /* Header */
  .tw-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .tw-tag-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .tw-tag {
    font-family: var(--tw-font);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--tw-gold);
  }
  .tw-tag-rule {
    height: 1px;
    width: 56px;
    background: var(--tw-gold);
    opacity: 0.55;
    flex-shrink: 0;
  }

  .tw-headline {
    font-family: var(--tw-font);
    font-weight: 600;
    font-size: clamp(1.9rem, 3.8vw, 3rem);
    line-height: 1.22;
    color: var(--tw-text-hi);
    letter-spacing: -0.02em;
  }

  .tw-browse {
    flex-shrink: 0;
    font-family: var(--tw-font);
    font-size: 13px;
    font-weight: 400;
    color: var(--tw-gold);
    text-decoration: none;
    letter-spacing: 0.01em;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding-bottom: 1px;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
    white-space: nowrap;
    align-self: flex-end;
    margin-bottom: 6px;
  }
  .tw-browse:hover { border-color: var(--tw-gold); }
  .tw-browse:focus-visible { outline: 2px solid var(--tw-gold); outline-offset: 3px; border-radius: 2px; }

  /* Feature block */
  .tw-feature {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    border: 1px solid var(--tw-divider);
    border-radius: var(--tw-radius);
    overflow: hidden;
    min-height: 480px;
  }

  /* Left: text panel */
  .tw-text-panel {
    background: var(--tw-surface);
    padding: 48px 48px 38px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--tw-divider);
  }

  .tw-slides-stack {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .tw-slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }
  .tw-slide.is-active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    position: relative;
  }

  .tw-series {
    font-family: var(--tw-font);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--tw-gold);
  }

  .tw-title {
    font-family: var(--tw-font);
    font-weight: 600;
    font-size: clamp(1.45rem, 2.4vw, 2.05rem);
    line-height: 1.25;
    color: var(--tw-text-hi);
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .tw-desc {
    font-family: var(--tw-font);
    font-size: 14px;
    font-weight: 300;
    line-height: 1.75;
    color: var(--tw-text-lo);
    max-width: 46ch;
  }

  .tw-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--tw-font);
    font-size: 12px;
    font-weight: 400;
    color: var(--tw-text-lo);
    flex-wrap: wrap;
  }
  .tw-meta-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
    opacity: 0.5;
  }

  .tw-actions {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .tw-btn-watch {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-family: var(--tw-font);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--tw-text-hi);
    text-decoration: none;
    padding: 11px 22px;
    border: 1px solid var(--tw-btn-border);
    border-radius: 5px;
    background: transparent;
    transition: background 0.18s, border-color 0.18s;
    white-space: nowrap;
  }
  .tw-btn-watch:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(240,240,238,0.45);
  }
  .tw-btn-watch:focus-visible { outline: 2px solid var(--tw-gold); outline-offset: 3px; }

  /* Controls */
  .tw-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--tw-divider);
  }

  .tw-indicators {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .tw-dot {
    position: relative;
    border: none;
    background: transparent;
    padding: 0 0 6px;
    cursor: pointer;
    font-family: var(--tw-font);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--tw-indicator-off);
    transition: color 0.25s;
    line-height: 1;
  }
  .tw-dot::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 1.5px;
    background: var(--tw-gold);
    border-radius: 1px;
    transition: width 0.3s ease;
  }
  .tw-dot.is-active {
    color: var(--tw-gold);
  }
  .tw-dot.is-active::after {
    width: 100%;
  }
  .tw-dot:focus-visible { outline: 2px solid var(--tw-gold); outline-offset: 3px; border-radius: 2px; }

  .tw-arrows {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tw-arrow {
    width: 36px;
    height: 36px;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--tw-text-lo);
    transition: color 0.18s, transform 0.18s;
    padding: 0;
  }
  .tw-arrow:hover { color: var(--tw-gold); }
  .tw-arrow:hover svg { transform: translateX(var(--nudge, 0)); }
  #twPrev { --nudge: -2px; }
  #twNext { --nudge: 2px; }
  .tw-arrow svg { transition: transform 0.18s; }
  .tw-arrow:focus-visible { outline: 2px solid var(--tw-gold); outline-offset: 2px; border-radius: 3px; }

  /* Right: image panel */
  .tw-image-panel {
    position: relative;
    background: #0a0a0a;
    overflow: hidden;
  }

  .tw-img-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.55s ease;
  }
  .tw-img-slide.is-active { opacity: 1; }

  .tw-img-bg {
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
  }

  /* Subtle left-side gradient so text panel edges blend */
  .tw-img-slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(26,26,26,0.18) 0%, transparent 30%),
                linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.3) 100%);
    pointer-events: none;
  }

  /* Play button overlay */
  .tw-play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.65);
    background: rgba(0,0,0,0.38);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.18s, border-color 0.18s, transform 0.18s;
    backdrop-filter: blur(6px);
  }
  .tw-play:hover {
    background: rgba(0,0,0,0.6);
    border-color: #fff;
    transform: translate(-50%, -50%) scale(1.06);
  }
  .tw-play:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .tw-play svg { margin-left: 3px; }

  /* Responsive */
  @media (max-width: 860px) {
    .tw-feature {
      grid-template-columns: 1fr;
      grid-template-rows: auto 320px;
    }
    .tw-text-panel {
      border-right: none;
      border-bottom: 1px solid var(--tw-divider);
      padding: 32px 28px 28px;
    }
    .tw-image-panel { order: -1; }
  }

  @media (max-width: 520px) {
    .teachings { padding-block: 48px 56px; }
    .tw-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .tw-browse { align-self: flex-start; }
  }
</style>
</head>
<body>
<section class="teachings" id="teachings" aria-label="Latest Teaching">
  <div class="teachings-inner">

    <header class="tw-header">
      <div>
        <div class="tw-tag-row">
          <span class="tw-tag">Latest Teaching</span>
          <span class="tw-tag-rule" aria-hidden="true"></span>
        </div>
        <h2 class="tw-headline">The word for<br>where you are now</h2>
      </div>
      <a href="#" class="tw-browse" aria-label="Browse the full teaching library">
        Browse the library
        <svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true">
          <path d="M9 1l5 4-5 4M0 5h14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </header>

    <div class="tw-feature" id="twFeature">
      <div class="tw-text-panel">
        <div class="tw-slides-stack" id="twSlidesStack"></div>
        <div class="tw-controls">
          <div class="tw-indicators" id="twIndicators" role="tablist" aria-label="Teaching slides"></div>
          <div class="tw-arrows">
            <button class="tw-arrow" id="twPrev" aria-label="Previous teaching">
              <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
                <path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="1" y1="7" x2="17" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="tw-arrow" id="twNext" aria-label="Next teaching">
              <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
                <path d="M11 1l6 6-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="17" y1="7" x2="1" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="tw-image-panel" id="twImagePanel"></div>
    </div>

  </div>
</section>

<script>
(function () {
  var SLIDES     = TW_SLIDES;
  var TOTAL      = SLIDES.length;
  var current    = 0;
  var autoTimer  = null;
  var AUTO_DELAY = 3800;

  var stack    = document.getElementById('twSlidesStack');
  var imgPanel = document.getElementById('twImagePanel');
  var indics   = document.getElementById('twIndicators');
  var btnPrev  = document.getElementById('twPrev');
  var btnNext  = document.getElementById('twNext');

  var playSVG = '<svg width="15" height="17" viewBox="0 0 15 17" fill="none" aria-hidden="true"><path d="M2 1.5l11 7-11 7V1.5Z" fill="white"/></svg>';

  SLIDES.forEach(function (s, i) {
    // Text slide
    var slide = document.createElement('div');
    slide.className = 'tw-slide' + (i === 0 ? ' is-active' : '');
    slide.setAttribute('role', 'group');
    slide.setAttribute('aria-roledescription', 'slide');
    slide.setAttribute('aria-label', 'Slide ' + (i + 1) + ' of ' + TOTAL);

    var metaHTML = '<span>' + esc(s.date) + '</span>';
    if (s.duration) {
      metaHTML += '<span class="tw-meta-dot" aria-hidden="true"></span><span>' + esc(s.duration) + '</span>';
    }
    metaHTML += '<span class="tw-meta-dot" aria-hidden="true"></span><span>' + esc(s.type) + '</span>';

    slide.innerHTML =
      '<div class="tw-series">' + esc(s.series) + '</div>' +
      '<h3 class="tw-title">' + esc(s.title) + '</h3>' +
      '<p class="tw-desc">' + esc(s.desc) + '</p>' +
      '<div class="tw-meta">' + metaHTML + '</div>' +
      '<div class="tw-actions">' +
        '<a href="' + esc(s.watchUrl) + '" class="tw-btn-watch" target="_blank" rel="noopener">' +
          'Watch Now' +
          '<svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M9 1l5 4-5 4M0 5h14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</a>' +
      '</div>';
    stack.appendChild(slide);

    // Image slide
    var imgWrap = document.createElement('div');
    imgWrap.className = 'tw-img-slide' + (i === 0 ? ' is-active' : '');
    var imgBg = document.createElement('div');
    imgBg.className = 'tw-img-bg';
    imgBg.setAttribute('role', 'img');
    imgBg.setAttribute('aria-label', 'Apostle Emmanuel Iren — ' + s.title);
    imgBg.style.backgroundImage = 'url(' + s.imageUrl + ')';
    imgBg.style.backgroundSize = s.bgSize || 'cover';
    imgBg.style.backgroundPosition = s.bgPos || 'center center';
    imgWrap.appendChild(imgBg);
    var play = document.createElement('a');
    play.href = s.watchUrl;
    play.target = '_blank';
    play.rel = 'noopener';
    play.className = 'tw-play';
    play.setAttribute('aria-label', 'Watch ' + s.title);
    play.innerHTML = playSVG;
    imgWrap.appendChild(play);
    imgPanel.appendChild(imgWrap);

    // Dot indicator
    var dot = document.createElement('button');
    dot.className = 'tw-dot' + (i === 0 ? ' is-active' : '');
    dot.setAttribute('role', 'tab');
    dot.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    dot.setAttribute('aria-label', 'Slide ' + (i + 1));
    dot.dataset.index = i;
    dot.textContent = String(i + 1).padStart(2, '0');
    indics.appendChild(dot);
  });

  function goTo(idx) {
    var prev = current;
    current = ((idx % TOTAL) + TOTAL) % TOTAL;
    if (current === prev) return;
    var slides = stack.querySelectorAll('.tw-slide');
    var imgs   = imgPanel.querySelectorAll('.tw-img-slide');
    var dots   = indics.querySelectorAll('.tw-dot');
    slides[prev].classList.remove('is-active');
    imgs[prev].classList.remove('is-active');
    dots[prev].classList.remove('is-active');
    dots[prev].setAttribute('aria-selected', 'false');
    slides[current].classList.add('is-active');
    imgs[current].classList.add('is-active');
    dots[current].classList.add('is-active');
    dots[current].setAttribute('aria-selected', 'true');
  }

  function startAuto() { clearInterval(autoTimer); autoTimer = setInterval(function () { goTo(current + 1); }, AUTO_DELAY); }
  function stopAuto()  { clearInterval(autoTimer); }

  btnPrev.addEventListener('click', function () { goTo(current - 1); startAuto(); });
  btnNext.addEventListener('click', function () { goTo(current + 1); startAuto(); });
  indics.addEventListener('click', function (e) {
    var d = e.target.closest('.tw-dot');
    if (d) { goTo(Number(d.dataset.index)); startAuto(); }
  });
  document.getElementById('twFeature').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  { goTo(current - 1); startAuto(); }
    if (e.key === 'ArrowRight') { goTo(current + 1); startAuto(); }
  });
  var sec = document.getElementById('teachings');
  sec.addEventListener('mouseenter', stopAuto);
  sec.addEventListener('mouseleave', startAuto);
  sec.addEventListener('focusin',    stopAuto);
  sec.addEventListener('focusout',   startAuto);
  startAuto();

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
